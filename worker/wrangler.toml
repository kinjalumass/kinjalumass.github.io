name = "kinjal-assistant"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Workers AI — this is what lets the Worker run a model with no API key.
[ai]
binding = "AI"

# Per-visitor rate limit so one person cannot burn the daily free allocation.
# 12 calls per 60s is generous for a human, useless for a script.
# If this ever blocks a deploy, delete this whole block — the Worker checks
# for the binding at runtime and simply skips it when absent.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 12
  period = 60
