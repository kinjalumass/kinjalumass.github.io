  <!-- ===================================================================
       Security

       GitHub Pages serves static files and cannot set response headers, so
       everything enforceable from the document itself is set here. The two
       that genuinely cannot be done this way: Strict-Transport-Security and
       X-Frame-Options: are covered by GitHub's "Enforce HTTPS" setting and
       by frame-ancestors below, which supersedes X-Frame-Options anyway.
       =================================================================== -->

  <!-- No plugins, no inline scripts, no framing, and connections limited to
       the three origins this site actually talks to. 'unsafe-inline' is
       present for styles only: Angular injects component styles inline. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self';
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com;
    img-src 'self' data: blob:;
    connect-src 'self' https://api.github.com https://kinjal-assistant.kinjalpandey.workers.dev https://api.emailjs.com;
    frame-ancestors 'none';
    base-uri 'self';
    form-action 'none';
    object-src 'none';
    upgrade-insecure-requests
  ">

  <!-- Don't leak the full URL to third parties -->
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <!-- Monogram, not Angular's default. SVG first for crisp rendering at any
       size, .ico as the fallback older browsers and Windows still ask for. -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
