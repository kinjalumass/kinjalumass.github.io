name: Deploy kinjalpandey.com

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Every route is prerendered to its own directory, so there is no SPA
      # fallback to set up — and 404.html must NOT be overwritten with
      # index.html, because public/404.html is a real not-found page.
      - run: npm run build

      - name: Check the build produced what we expect
        run: |
          test -f dist/portfolio/browser/index.html
          test -f dist/portfolio/browser/CNAME
          test -f dist/portfolio/browser/404.html
          test -f dist/portfolio/browser/.nojekyll
          echo "prerendered pages: $(find dist/portfolio/browser -name index.html | wc -l)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/portfolio/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
