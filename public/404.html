<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Not found — Kinjal Pandey</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#08080a">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'none'; base-uri 'self'; form-action 'none'; object-src 'none'; frame-ancestors 'none'">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background:
        radial-gradient(120% 90% at 50% 0%, #0f1614, transparent 60%),
        #08080a;
      color: #f2efe9;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-weight: 300;
    }
    .wrap { max-width: 34rem; text-align: left; }
    .code {
      font-size: 0.62rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(124, 255, 178, 0.75);
    }
    h1 {
      margin: 1.25rem 0 0;
      font-size: clamp(1.9rem, 6vw, 3.2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.05;
    }
    p {
      margin-top: 1.1rem;
      max-width: 46ch;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 0.95rem;
      line-height: 1.7;
      color: rgba(242, 239, 233, 0.62);
    }
    .rule {
      width: min(20rem, 60%);
      height: 1px;
      margin: 2rem 0;
      background: linear-gradient(90deg, rgb(124, 255, 178), transparent);
    }
    nav { display: flex; flex-wrap: wrap; gap: 0.6rem; }
    a {
      display: inline-block;
      padding: 0.55rem 1rem;
      border: 1px solid rgba(124, 255, 178, 0.3);
      font-size: 0.66rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgb(124, 255, 178);
      text-decoration: none;
      transition: background 0.3s, border-color 0.3s;
    }
    a:hover, a:focus-visible {
      background: rgba(124, 255, 178, 0.1);
      border-color: rgba(124, 255, 178, 0.7);
    }
  </style>
</head>
<body>
  <main class="wrap">
    <span class="code">error 404 — no such path</span>
    <h1>That page doesn't exist.</h1>
    <p>
      The link may be out of date, or the address mistyped. Everything on the site
      is reachable from one of these.
    </p>
    <div class="rule" aria-hidden="true"></div>
    <nav>
      <a href="/">Index</a>
      <a href="/developer">Developer</a>
      <a href="/entrepreneur">Entrepreneur</a>
      <a href="/model">Model</a>
    </nav>
  </main>
</body>
</html>
